<title>关于印发《住房公积金会计核算办法》的通知</title>
</head>

<body bgcolor="rgb(255,255,233)">

<p align="center"><font color="#FF0000"><strong>关于印发《住房公积金会计核算办法》的通知</strong></font></p>

<p align="center">财会字[1999]33号</p>

<p><span style="line-height: 24px"><font>各省、自治区、直辖市、计划单列市财政厅（局）：</font></p>

<p><span style="line-height: 24px"><font>　　为了规范和加强住房公积金的会计核算，维护住房公积金所有者的合法权益，根据<a
href="991706f.htm">《中华人民共和国会计法》</a>、《住房公积金管理条例》、《住房公积金财务管理办法》，我们制定了<a
href="991801f4.htm">《住房公积金会计核算办法》</a>，现印发给你们，请转发所属住房公积金管理中心，自2000年1月1日起执行。执行中有何问题，请及时函告我部。</font></p>

<p><span style="line-height: 24px">　</p>

<p align="right">中华人民共和国财政部&nbsp;&nbsp;&nbsp;&nbsp; </p>

<p align="right"><font>一九九九年十月十四日&nbsp;&nbsp;&nbsp;&nbsp; </font></p>
</span></span></span>
</body>
